<svg xmlns="http://www.w3.org/2000/svg" width="1168" height="460" viewBox="0 0 1168 460"><rect x="0" y="0" width="1168" height="460" fill="white"/><g font-family="Arial, sans-serif"><text x="24" y="28" font-size="21" fill="#243249" text-anchor="start">PA1 · Closepath does not prohibit a later drawing command</text><text x="24" y="49" font-size="12" fill="#243249" text-anchor="start">Code: svg_path/parse.parse_close</text><text x="24" y="67" font-size="11" fill="#8090a2" text-anchor="start">Blue: source / reference    Red: current output    Green: expected / comparison</text><rect x="24" y="83" width="550" height="361" rx="9" fill="#fafbfd" stroke="#dce3ea"/><text x="40" y="109" font-size="16" fill="#243249" text-anchor="start">M 0 0   L 1 0   Z</text><defs><clipPath id="panel0"><rect x="34" y="123" width="530" height="273"/></clipPath></defs><g clip-path="url(#panel0)"><path d="M 0 0 H 1" transform="matrix(237 0 0 237 62 250.5)" fill="none" stroke="#2463a6" stroke-width="2" stroke-opacity=".85" vector-effect="non-scaling-stroke"/><circle cx="62" cy="250.5" r="4" fill="#243249"/><circle cx="299" cy="250.5" r="4" fill="#243249"/><path d="M109.4,269.46 L227.89999999999998,269.46 M220.5315120479769,272.5753467384692 L227.89999999999998,269.46 L220.5315120479769,266.34465326153077" stroke="#243249" stroke-width="2" fill="none"/><path d="M227.89999999999998,231.54 L109.4,231.54 M116.7684879520231,228.42465326153078 L109.4,231.54 L116.7684879520231,234.6553467384692" stroke="#243249" stroke-width="2" fill="none"/></g><text x="40" y="412" font-size="12" fill="#243249" text-anchor="start">Z returns the current point to the subpath start.</text><text x="40" y="430" font-size="12" fill="#243249" text-anchor="start">The drawing has returned to (0,0).</text><rect x="594" y="83" width="550" height="361" rx="9" fill="#fafbfd" stroke="#dce3ea"/><text x="610" y="109" font-size="16" fill="#243249" text-anchor="start">Then L 2 0 should start a new subpath</text><defs><clipPath id="panel1"><rect x="604" y="123" width="530" height="273"/></clipPath></defs><g clip-path="url(#panel1)"><path d="M 0 0 H 2" transform="matrix(237 0 0 237 632 250.5)" fill="none" stroke="#16836a" stroke-width="2" stroke-opacity=".85" vector-effect="non-scaling-stroke"/><circle cx="632" cy="250.5" r="4" fill="#243249"/><circle cx="1106" cy="250.5" r="4" fill="#243249"/></g><text x="610" y="412" font-size="12" fill="#243249" text-anchor="start">Green: specified continuation, not current parser output.</text><text x="610" y="430" font-size="12" fill="#243249" text-anchor="start">Current parser returns ExpectedMove.</text></g></svg>