<svg xmlns="http://www.w3.org/2000/svg" width="1168" height="460" viewBox="0 0 1168 460"><rect x="0" y="0" width="1168" height="460" fill="white"/><g font-family="Arial, sans-serif"><text x="24" y="28" font-size="21" fill="#243249" text-anchor="start">SP1 · Extrapolation reverses a child, not the original line</text><text x="24" y="49" font-size="12" fill="#243249" text-anchor="start">Code: svg_path.segment_directions_with</text><text x="24" y="67" font-size="11" fill="#8090a2" text-anchor="start">Blue: source / reference    Red: current output    Green: expected / comparison</text><rect x="24" y="83" width="550" height="361" rx="9" fill="#fafbfd" stroke="#dce3ea"/><text x="40" y="109" font-size="16" fill="#243249" text-anchor="start">At t = −1: original line still points right</text><defs><clipPath id="panel0"><rect x="34" y="123" width="530" height="273"/></clipPath></defs><g clip-path="url(#panel0)"><path d="M 0 0 H 10" transform="matrix(19.75 0 0 19.75 299 250.5)" fill="none" stroke="#2463a6" stroke-width="2" stroke-opacity=".85" vector-effect="non-scaling-stroke"/><path d="M -10 0 H 0" transform="matrix(19.75 0 0 19.75 299 250.5)" fill="none" stroke="#8090a2" stroke-width="2" stroke-opacity=".85" vector-effect="non-scaling-stroke"/><circle cx="101.5" cy="250.5" r="4" fill="#16836a"/><path d="M101.5,250.5 L200.25,250.5 M192.8815120479769,253.6153467384692 L200.25,250.5 L192.8815120479769,247.3846532615308" stroke="#16836a" stroke-width="2" fill="none"/></g><text x="40" y="412" font-size="12" fill="#243249" text-anchor="start">Expected orientation along increasing t.</text><text x="40" y="430" font-size="12" fill="#243249" text-anchor="start">The source line is x = 10t.</text><rect x="594" y="83" width="550" height="361" rx="9" fill="#fafbfd" stroke="#dce3ea"/><text x="610" y="109" font-size="16" fill="#243249" text-anchor="start">Returned incoming direction points left</text><defs><clipPath id="panel1"><rect x="604" y="123" width="530" height="273"/></clipPath></defs><g clip-path="url(#panel1)"><path d="M 0 0 H 10" transform="matrix(19.75 0 0 19.75 869 250.5)" fill="none" stroke="#2463a6" stroke-width="2" stroke-opacity=".85" vector-effect="non-scaling-stroke"/><circle cx="671.5" cy="250.5" r="4" fill="#d43d46"/><path d="M750.5,250.5 L651.75,250.5 M659.1184879520231,247.3846532615308 L651.75,250.5 L659.1184879520231,253.6153467384692" stroke="#d43d46" stroke-width="2" fill="none"/></g><text x="610" y="412" font-size="12" fill="#243249" text-anchor="start">At t = 2, the outgoing direction has the same defect.</text><text x="610" y="430" font-size="12" fill="#243249" text-anchor="start">A split-child orientation leaks into the answer.</text></g></svg>