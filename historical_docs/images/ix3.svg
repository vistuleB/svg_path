<svg xmlns="http://www.w3.org/2000/svg" width="1168" height="460" viewBox="0 0 1168 460"><rect x="0" y="0" width="1168" height="460" fill="white"/><g font-family="Arial, sans-serif"><text x="24" y="28" font-size="21" fill="#243249" text-anchor="start">IX3 · A crossing can have parallel tangents</text><text x="24" y="49" font-size="12" fill="#243249" text-anchor="start">Code: svg_path/intersections.classify_directions</text><text x="24" y="67" font-size="11" fill="#8090a2" text-anchor="start">Blue: source / reference    Red: current output    Green: expected / comparison</text><rect x="24" y="83" width="550" height="361" rx="9" fill="#fafbfd" stroke="#dce3ea"/><text x="40" y="109" font-size="16" fill="#243249" text-anchor="start">Exact cubic: y = (t − 0.5)³</text><defs><clipPath id="panel0"><rect x="34" y="123" width="530" height="273"/></clipPath></defs><g clip-path="url(#panel0)"><path d="M 0 -0.125 C 0.3333333333333333 0.125 0.6666666666666666 -0.125 1 0.125" transform="matrix(474 0 0 908 62 250.5)" fill="none" stroke="#2463a6" stroke-width="2" stroke-opacity=".85" vector-effect="non-scaling-stroke"/><path d="M 0 0 H 1" transform="matrix(474 0 0 908 62 250.5)" fill="none" stroke="#8650b5" stroke-width="2" stroke-opacity=".85" vector-effect="non-scaling-stroke"/><circle cx="299" cy="250.5" r="4" fill="#243249"/></g><text x="40" y="412" font-size="12" fill="#243249" text-anchor="start">The cubic passes from one side of the line to the other.</text><text x="40" y="430" font-size="12" fill="#243249" text-anchor="start">Both first derivatives are horizontal at the contact.</text><rect x="594" y="83" width="550" height="361" rx="9" fill="#fafbfd" stroke="#dce3ea"/><text x="610" y="109" font-size="16" fill="#243249" text-anchor="start">Current classification: Touching</text><defs><clipPath id="panel1"><rect x="604" y="123" width="530" height="273"/></clipPath></defs><g clip-path="url(#panel1)"><path d="M 0 -0.125 C 0.3333333333333333 0.125 0.6666666666666666 -0.125 1 0.125" transform="matrix(2370.0000000000005 0 0 56750 -316.0000000000002 250.5)" fill="none" stroke="#2463a6" stroke-width="2" stroke-opacity=".85" vector-effect="non-scaling-stroke"/><path d="M 0 0 H 1" transform="matrix(2370.0000000000005 0 0 56750 -316.0000000000002 250.5)" fill="none" stroke="#8650b5" stroke-width="2" stroke-opacity=".85" vector-effect="non-scaling-stroke"/><circle cx="869" cy="250.5" r="4" fill="#d43d46"/></g><text x="610" y="412" font-size="12" fill="#243249" text-anchor="start">Magnified contact, not a second geometry example.</text><text x="610" y="430" font-size="12" fill="#243249" text-anchor="start">Question: topology, or only transverse crossing?</text></g></svg>