<svg xmlns="http://www.w3.org/2000/svg" width="1168" height="460" viewBox="0 0 1168 460"><rect x="0" y="0" width="1168" height="460" fill="white"/><g font-family="Arial, sans-serif"><text x="24" y="28" font-size="21" fill="#243249" text-anchor="start">OF1 · Zero offset: two preimages, only one eligible survivor</text><text x="24" y="49" font-size="12" fill="#243249" text-anchor="start">Code: svg_path/offset.forced_parity_capacities</text><text x="24" y="67" font-size="11" fill="#8090a2" text-anchor="start">Blue: source / reference    Red: current output    Green: expected / comparison</text><rect x="24" y="83" width="550" height="361" rx="9" fill="#fafbfd" stroke="#dce3ea"/><text x="40" y="109" font-size="16" fill="#243249" text-anchor="start">Zero-source and zero-offset lie on the same square</text><defs><clipPath id="panel0"><rect x="34" y="123" width="530" height="273"/></clipPath></defs><g clip-path="url(#panel0)"><path d="M 0 0 H 10" transform="matrix(22.7 0 0 22.7 185.5 137)" fill="none" stroke="#2463a6" stroke-width="6" stroke-opacity=".85" vector-effect="non-scaling-stroke"/><path d="M 10 0 V 10" transform="matrix(22.7 0 0 22.7 185.5 137)" fill="none" stroke="#2463a6" stroke-width="6" stroke-opacity=".85" vector-effect="non-scaling-stroke"/><path d="M 10 10 H 0" transform="matrix(22.7 0 0 22.7 185.5 137)" fill="none" stroke="#2463a6" stroke-width="6" stroke-opacity=".85" vector-effect="non-scaling-stroke"/><path d="M 0 10 V 0" transform="matrix(22.7 0 0 22.7 185.5 137)" fill="none" stroke="#2463a6" stroke-width="6" stroke-opacity=".85" vector-effect="non-scaling-stroke"/><path d="M 0 0 H 10" transform="matrix(22.7 0 0 22.7 185.5 137)" fill="none" stroke="#d43d46" stroke-width="2" stroke-opacity=".85" vector-effect="non-scaling-stroke"/><path d="M 10 0 V 10" transform="matrix(22.7 0 0 22.7 185.5 137)" fill="none" stroke="#d43d46" stroke-width="2" stroke-opacity=".85" vector-effect="non-scaling-stroke"/><path d="M 10 10 H 0" transform="matrix(22.7 0 0 22.7 185.5 137)" fill="none" stroke="#d43d46" stroke-width="2" stroke-opacity=".85" vector-effect="non-scaling-stroke"/><path d="M 0 10 V 0" transform="matrix(22.7 0 0 22.7 185.5 137)" fill="none" stroke="#d43d46" stroke-width="2" stroke-opacity=".85" vector-effect="non-scaling-stroke"/></g><text x="40" y="412" font-size="12" fill="#243249" text-anchor="start">Blue: source; red: offset (identical geometry).</text><text x="40" y="430" font-size="12" fill="#243249" text-anchor="start">Default single-offset call returns ConstructionFailed.</text><rect x="594" y="83" width="550" height="361" rx="9" fill="#fafbfd" stroke="#dce3ea"/><text x="610" y="109" font-size="16" fill="#243249" text-anchor="start">One shared geometric edge</text><defs><clipPath id="panel1"><rect x="604" y="123" width="530" height="273"/></clipPath></defs><g clip-path="url(#panel1)"><path d="M 0 0 H 10" transform="matrix(47.4 0 0 47.4 632 250.5)" fill="none" stroke="#243249" stroke-width="3" stroke-opacity=".85" vector-effect="non-scaling-stroke"/></g><text x="869" y="232.5" font-size="12" fill="#243249" text-anchor="middle">capacity 2  /  offset occurrences 1</text><text x="610" y="412" font-size="12" fill="#243249" text-anchor="start">Capacity counted both source and offset images.</text><text x="610" y="430" font-size="12" fill="#243249" text-anchor="start">Only the offset image can consume the capacity.</text></g></svg>