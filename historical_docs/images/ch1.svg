<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="370" viewBox="0 0 1140 370"><rect x="0" y="0" width="1140" height="370" fill="white"/><g font-family="Arial, sans-serif"><text x="24" y="30" font-size="21" fill="#243249" text-anchor="start">CH1 · Applying an error allowance after pruning is too late</text><text x="24" y="51" font-size="12" fill="#243249" text-anchor="start">Code: svg_path/convex_hull.minimum_width_optimization_loop</text><text x="24" y="70" font-size="11" fill="#8090a2" text-anchor="start">EXPLANATORY DIAGRAM — not a reproduced geometric output</text><rect x="24" y="82" width="344" height="215" rx="10" fill="#f7f9fc" stroke="#dce3ea"/><text x="40" y="110" font-size="17" fill="#2463a6" text-anchor="start">Pruning uses raw lower bound</text><text x="40" y="146" font-size="14" fill="#243249" text-anchor="start">raw lower = U + ε/2</text><text x="40" y="174" font-size="14" fill="#243249" text-anchor="start">Allowance = ε</text><text x="40" y="202" font-size="14" fill="#243249" text-anchor="start">Interval is discarded against U</text><text x="373" y="195" font-size="22" fill="#8090a2" text-anchor="start">→</text><rect x="396" y="82" width="344" height="215" rx="10" fill="#f7f9fc" stroke="#dce3ea"/><text x="412" y="110" font-size="17" fill="#2463a6" text-anchor="start">Report uses adjusted bound</text><text x="412" y="146" font-size="14" fill="#243249" text-anchor="start">safe lower = U − ε/2</text><text x="412" y="174" font-size="14" fill="#243249" text-anchor="start">But the interval is already gone</text><text x="412" y="202" font-size="14" fill="#243249" text-anchor="start">Empty queue can say converged</text><text x="745" y="195" font-size="22" fill="#8090a2" text-anchor="start">→</text><rect x="768" y="82" width="344" height="215" rx="10" fill="#f7f9fc" stroke="#dce3ea"/><text x="784" y="110" font-size="17" fill="#16836a" text-anchor="start">Recommended invariant</text><text x="784" y="146" font-size="14" fill="#243249" text-anchor="start">Use the safe bound before pruning</text><text x="784" y="174" font-size="14" fill="#243249" text-anchor="start">Use it in convergence decisions too</text><text x="784" y="202" font-size="14" fill="#243249" text-anchor="start">Need a failing ordinary fixture</text><text x="24" y="333" font-size="13" fill="#243249" text-anchor="start">Schematic inequality with symbolic ε; no fabricated numeric hull counterexample.</text></g></svg>