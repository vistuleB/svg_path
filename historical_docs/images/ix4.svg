<svg xmlns="http://www.w3.org/2000/svg" width="1168" height="460" viewBox="0 0 1168 460"><rect x="0" y="0" width="1168" height="460" fill="white"/><g font-family="Arial, sans-serif"><text x="24" y="28" font-size="21" fill="#243249" text-anchor="start">IX4 · One location can require two parameter pairs</text><text x="24" y="49" font-size="12" fill="#243249" text-anchor="start">Code: svg_path/intersections.insert_intersection</text><text x="24" y="67" font-size="11" fill="#8090a2" text-anchor="start">Blue: source / reference    Red: current output    Green: expected / comparison</text><rect x="24" y="83" width="550" height="361" rx="9" fill="#fafbfd" stroke="#dce3ea"/><text x="40" y="109" font-size="16" fill="#243249" text-anchor="start">Closed cubic meets the line at both ends</text><defs><clipPath id="panel0"><rect x="34" y="123" width="530" height="273"/></clipPath></defs><g clip-path="url(#panel0)"><path d="M 0 0 C 1 1 -1 1 0 0" transform="matrix(118.5 0 0 118.5 299 191.25)" fill="none" stroke="#2463a6" stroke-width="2" stroke-opacity=".85" vector-effect="non-scaling-stroke"/><path d="M -2 0 H 2" transform="matrix(118.5 0 0 118.5 299 191.25)" fill="none" stroke="#8650b5" stroke-width="2" stroke-opacity=".85" vector-effect="non-scaling-stroke"/><circle cx="299" cy="191.25" r="4" fill="#243249"/></g><text x="309" y="176.25" font-size="12" fill="#243249" text-anchor="start">t = 0 AND t = 1</text><text x="40" y="412" font-size="12" fill="#243249" text-anchor="start">The two endpoints coincide geometrically.</text><text x="40" y="430" font-size="12" fill="#243249" text-anchor="start">The line parameter is 0.5 in both cases.</text><rect x="594" y="83" width="550" height="361" rx="9" fill="#fafbfd" stroke="#dce3ea"/><text x="610" y="109" font-size="16" fill="#243249" text-anchor="start">Returned list contains only (0, 0.5)</text><defs><clipPath id="panel1"><rect x="604" y="123" width="530" height="273"/></clipPath></defs><g clip-path="url(#panel1)"><path d="M 0 0 C 1 1 -1 1 0 0" transform="matrix(118.5 0 0 118.5 869 191.25)" fill="none" stroke="#8090a2" stroke-width="2" stroke-opacity=".85" vector-effect="non-scaling-stroke"/><path d="M -2 0 H 2" transform="matrix(118.5 0 0 118.5 869 191.25)" fill="none" stroke="#8650b5" stroke-width="2" stroke-opacity=".85" vector-effect="non-scaling-stroke"/><circle cx="869" cy="191.25" r="4" fill="#d43d46"/></g><text x="610" y="412" font-size="12" fill="#243249" text-anchor="start">Geometric deduplication merges the two addresses.</text><text x="610" y="430" font-size="12" fill="#243249" text-anchor="start">Noding may need both, despite the shared location.</text></g></svg>