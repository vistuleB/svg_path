<svg xmlns="http://www.w3.org/2000/svg" width="920" height="650" viewBox="0 0 920 650">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#2563eb"/>
    </marker>
    <style>
      .panel { fill: #fafafa; stroke: #d1d5db; stroke-width: 1.5; }
      .bounds { fill: none; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .axis { stroke: #dbe2ea; stroke-width: 1; }
      .shape { fill: #60a5fa; fill-opacity: .13; stroke: #2563eb; stroke-width: 4; marker-mid: url(#arrow-blue); marker-end: url(#arrow-blue); }
      .cardinal { fill: white; stroke: #2563eb; stroke-width: 2; }
      .start { fill: #ef4444; stroke: white; stroke-width: 2; }
      .center-line { stroke: #111827; stroke-width: 1.6; }
      .center { fill: #111827; }
      .title { font: 600 18px ui-sans-serif, system-ui, sans-serif; fill: #111827; }
      .caption { font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #4b5563; }
      .note { font: 14px ui-sans-serif, system-ui, sans-serif; fill: #4b5563; }
      .quarter { font: 12px ui-sans-serif, system-ui, sans-serif; fill: #2563eb; }
    </style>
  </defs>

  <rect width="920" height="650" fill="white"/>
  <text x="40" y="34" class="title">basic_shapes.circle / ellipse → Subpath verification</text>
  <text x="40" y="57" class="note">Red dot = start at 3 o’clock. Arrowheads mark the four emitted quarter arcs, proceeding clockwise in SVG coordinates.</text>

  <g transform="translate(30 80)">
    <rect class="panel" width="420" height="250" rx="8"/>
    <text x="18" y="28" class="title">Circle: center (100, 90), r = 55</text>
    <g transform="translate(110 38)">
      <line class="axis" x1="45" y1="90" x2="155" y2="90"/>
      <line class="axis" x1="100" y1="35" x2="100" y2="145"/>
      <rect class="bounds" x="45" y="35" width="110" height="110"/>
      <path class="shape" d="M 155 90 A 55 55 0 0 1 100 145 A 55 55 0 0 1 45 90 A 55 55 0 0 1 100 35 A 55 55 0 0 1 155 90 Z"/>
      <circle class="cardinal" cx="100" cy="145" r="4"/><circle class="cardinal" cx="45" cy="90" r="4"/><circle class="cardinal" cx="100" cy="35" r="4"/>
      <circle class="start" cx="155" cy="90" r="6"/>
      <line class="center-line" x1="94" y1="90" x2="106" y2="90"/><line class="center-line" x1="100" y1="84" x2="100" y2="96"/><circle class="center" cx="100" cy="90" r="2"/>
    </g>
    <text x="18" y="226" class="caption">M 155 90  A 55 55 … 1 100 145 … Z</text>
  </g>

  <g transform="translate(470 80)">
    <rect class="panel" width="420" height="250" rx="8"/>
    <text x="18" y="28" class="title">Wide ellipse: center (100, 90), rx = 75, ry = 40</text>
    <g transform="translate(110 38)">
      <line class="axis" x1="25" y1="90" x2="175" y2="90"/>
      <line class="axis" x1="100" y1="50" x2="100" y2="130"/>
      <rect class="bounds" x="25" y="50" width="150" height="80"/>
      <path class="shape" d="M 175 90 A 75 40 0 0 1 100 130 A 75 40 0 0 1 25 90 A 75 40 0 0 1 100 50 A 75 40 0 0 1 175 90 Z"/>
      <circle class="cardinal" cx="100" cy="130" r="4"/><circle class="cardinal" cx="25" cy="90" r="4"/><circle class="cardinal" cx="100" cy="50" r="4"/>
      <circle class="start" cx="175" cy="90" r="6"/>
      <line class="center-line" x1="94" y1="90" x2="106" y2="90"/><line class="center-line" x1="100" y1="84" x2="100" y2="96"/><circle class="center" cx="100" cy="90" r="2"/>
    </g>
    <text x="18" y="226" class="caption">M 175 90  A 75 40 … 1 100 130 … Z</text>
  </g>

  <g transform="translate(30 350)">
    <rect class="panel" width="420" height="250" rx="8"/>
    <text x="18" y="28" class="title">Tall ellipse: center (130, 100), rx = 35, ry = 70</text>
    <g transform="translate(80 35)">
      <line class="axis" x1="95" y1="100" x2="165" y2="100"/>
      <line class="axis" x1="130" y1="30" x2="130" y2="170"/>
      <rect class="bounds" x="95" y="30" width="70" height="140"/>
      <path class="shape" d="M 165 100 A 35 70 0 0 1 130 170 A 35 70 0 0 1 95 100 A 35 70 0 0 1 130 30 A 35 70 0 0 1 165 100 Z"/>
      <circle class="cardinal" cx="130" cy="170" r="4"/><circle class="cardinal" cx="95" cy="100" r="4"/><circle class="cardinal" cx="130" cy="30" r="4"/>
      <circle class="start" cx="165" cy="100" r="6"/>
      <line class="center-line" x1="124" y1="100" x2="136" y2="100"/><line class="center-line" x1="130" y1="94" x2="130" y2="106"/><circle class="center" cx="130" cy="100" r="2"/>
    </g>
    <text x="18" y="226" class="caption">M 165 100  A 35 70 … 1 130 170 … Z</text>
  </g>

  <g transform="translate(470 350)">
    <rect class="panel" width="420" height="250" rx="8"/>
    <text x="18" y="28" class="title">Flat ellipse: center (120, 105), rx = 90, ry = 18</text>
    <g transform="translate(70 52)">
      <line class="axis" x1="30" y1="105" x2="210" y2="105"/>
      <line class="axis" x1="120" y1="87" x2="120" y2="123"/>
      <rect class="bounds" x="30" y="87" width="180" height="36"/>
      <path class="shape" d="M 210 105 A 90 18 0 0 1 120 123 A 90 18 0 0 1 30 105 A 90 18 0 0 1 120 87 A 90 18 0 0 1 210 105 Z"/>
      <circle class="cardinal" cx="120" cy="123" r="4"/><circle class="cardinal" cx="30" cy="105" r="4"/><circle class="cardinal" cx="120" cy="87" r="4"/>
      <circle class="start" cx="210" cy="105" r="6"/>
      <line class="center-line" x1="114" y1="105" x2="126" y2="105"/><line class="center-line" x1="120" y1="99" x2="120" y2="111"/><circle class="center" cx="120" cy="105" r="2"/>
    </g>
    <text x="18" y="226" class="caption">M 210 105  A 90 18 … 1 120 123 … Z</text>
  </g>
</svg>
