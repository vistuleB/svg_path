<svg xmlns="http://www.w3.org/2000/svg" width="940" height="520" viewBox="0 0 940 520">
  <defs>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#2563eb" />
    </marker>
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#ea580c" />
    </marker>
    <marker id="graph-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#334155" />
    </marker>
  </defs>

  <rect width="940" height="520" fill="#f8fafc" />
  <line x1="470" y1="30" x2="470" y2="470" stroke="#cbd5e1" />
  <text x="235" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#0f172a">Two input subpaths</text>
  <text x="705" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#0f172a">Arrangement graph</text>

  <!-- Circle 1: two clockwise 180-degree arcs, endpoints at 0 and 180 degrees. -->
  <g fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round" opacity="0.58" marker-end="url(#blue-arrow)">
    <path d="M365 240 A130 130 0 0 1 105 240" />
    <path d="M105 240 A130 130 0 0 1 365 240" />
  </g>

  <!-- Circle 2: opposite direction and endpoints rotated by 45 degrees. -->
  <g fill="none" stroke="#ea580c" stroke-width="8" stroke-linecap="round" opacity="0.58" marker-end="url(#orange-arrow)">
    <path d="M326.924 331.924 A130 130 0 0 0 143.076 148.076" />
    <path d="M143.076 148.076 A130 130 0 0 0 326.924 331.924" />
  </g>

  <g font-family="system-ui, sans-serif" font-size="14">
    <circle cx="115" cy="424" r="7" fill="#2563eb" opacity="0.72" />
    <text x="130" y="429" fill="#1d4ed8">subpath 1: clockwise</text>
    <circle cx="285" cy="424" r="7" fill="#ea580c" opacity="0.72" />
    <text x="300" y="429" fill="#c2410c">subpath 2: counterclockwise, +45° phase</text>
  </g>

  <!-- Graph edges: the union of both endpoint sets divides the circle into four arcs. -->
  <g fill="none" stroke="#334155" stroke-width="5" stroke-linecap="round" marker-end="url(#graph-arrow)">
    <path d="M835 240 A130 130 0 0 1 796.924 331.924" />
    <path d="M796.924 331.924 A130 130 0 0 1 575 240" />
    <path d="M575 240 A130 130 0 0 1 613.076 148.076" />
    <path d="M613.076 148.076 A130 130 0 0 1 835 240" />
  </g>

  <!-- Vertices occur at both circles' original arc boundaries. -->
  <g fill="#fff" stroke="#dc2626" stroke-width="3">
    <circle cx="835" cy="240" r="8" />
    <circle cx="796.924" cy="331.924" r="8" />
    <circle cx="575" cy="240" r="8" />
    <circle cx="613.076" cy="148.076" r="8" />
  </g>
  <g fill="#991b1b" font-family="ui-monospace, monospace" font-size="13">
    <text x="847" y="234">v0 · 0°</text>
    <text x="803" y="354">v1 · 45°</text>
    <text x="505" y="234">v2 · 180°</text>
    <text x="555" y="130">v3 · 225°</text>
  </g>

  <!-- Multiplicity cartouches at the geometric midpoint of each graph arc. -->
  <g font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">
    <g>
      <rect x="798.104" y="270.758" width="54" height="30" rx="6" fill="#fff" stroke="#94a3b8" />
      <text x="825.104" y="291">1/1</text>
    </g>
    <g>
      <rect x="628.250" y="333.602" width="54" height="30" rx="6" fill="#fff" stroke="#94a3b8" />
      <text x="655.250" y="354">1/1</text>
    </g>
    <g>
      <rect x="557.896" y="179.242" width="54" height="30" rx="6" fill="#fff" stroke="#94a3b8" />
      <text x="584.896" y="199.5">1/1</text>
    </g>
    <g>
      <rect x="727.750" y="116.398" width="54" height="30" rx="6" fill="#fff" stroke="#94a3b8" />
      <text x="754.750" y="136.7">1/1</text>
    </g>
  </g>

  <text x="705" y="424" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#475569">4 vertices · 4 geometric edges · every edge has one occurrence per direction</text>
  <text x="470" y="493" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">Adversarial semantic-overlap case: equal circles, incompatible arc subdivision</text>
</svg>
