<svg xmlns="http://www.w3.org/2000/svg" width="420" height="360" viewBox="0 0 420 360">
  <rect x="0" y="0" width="420" height="360" fill="white" />

  <line x1="20" y1="50" x2="390" y2="50" stroke="#ddd" />
  <line x1="20" y1="120" x2="390" y2="120" stroke="#ddd" />
  <line x1="20" y1="230" x2="390" y2="230" stroke="#ddd" />
  <line x1="20" y1="300" x2="390" y2="300" stroke="#ddd" />

  <circle cx="90" cy="50" r="2" fill="red" />
  <circle cx="260" cy="50" r="2" fill="red" />
  <circle cx="90" cy="120" r="2" fill="red" />
  <circle cx="260" cy="120" r="2" fill="red" />
  <circle cx="90" cy="230" r="2" fill="red" />
  <circle cx="240" cy="230" r="2" fill="red" />
  <circle cx="90" cy="300" r="2" fill="red" />
  <circle cx="240" cy="300" r="2" fill="red" />

  <text x="90" y="25" text-anchor="middle" font-family="sans-serif" font-size="12">M only</text>
  <text x="260" y="25" text-anchor="middle" font-family="sans-serif" font-size="12">M then zero-length L</text>
  <text x="20" y="54" text-anchor="start" font-family="sans-serif" font-size="12">round</text>
  <text x="20" y="124" text-anchor="start" font-family="sans-serif" font-size="12">square</text>
  <text x="90" y="205" text-anchor="middle" font-family="sans-serif" font-size="12">M only</text>
  <text x="240" y="205" text-anchor="middle" font-family="sans-serif" font-size="12">M then Z</text>
  <text x="20" y="234" text-anchor="start" font-family="sans-serif" font-size="12">round</text>
  <text x="20" y="304" text-anchor="start" font-family="sans-serif" font-size="12">square</text>

  <path d="M 90,50" style="fill: none; stroke: blue; stroke-width: 24; stroke-linecap: round;" />
  <path d="M 260,50 L 260,50" style="fill: none; stroke: blue; stroke-width: 24; stroke-linecap: round;" />

  <path d="M 90,120" style="fill: none; stroke: blue; stroke-width: 24; stroke-linecap: square;" />
  <path d="M 260,120 L 260,120" style="fill: none; stroke: blue; stroke-width: 24; stroke-linecap: square;" />

  <path d="M 90,230" style="fill: none; stroke: black; stroke-width: 24; stroke-linecap: round;" />
  <path d="M 240,230 Z" style="fill: none; stroke: black; stroke-width: 24; stroke-linecap: round;" />

  <path d="M 90,300" style="fill: none; stroke: black; stroke-width: 24; stroke-linecap: square;" />
  <path d="M 240,300 Z" style="fill: none; stroke: black; stroke-width: 24; stroke-linecap: square;" />
</svg>
