    <g id="blue180" fill="none" stroke="#2563eb" stroke-width="6" opacity=".62" marker-end="url(#ab)"><path d="M70 0A70 70 0 0 1-70 0"/><path d="M-70 0A70 70 0 0 1 70 0"/></g>
