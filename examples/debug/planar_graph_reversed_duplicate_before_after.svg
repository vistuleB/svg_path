<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c" />
    </marker>
    <marker id="arrow-graph" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" />
    </marker>
  </defs>

  <rect width="900" height="360" fill="#f8fafc" />
  <line x1="450" y1="30" x2="450" y2="330" stroke="#cbd5e1" stroke-width="1" />

  <text x="225" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#0f172a">Input subpaths</text>
  <text x="675" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#0f172a">Resulting graph</text>

  <!-- Two coincident input segments, shown with translucent strokes. -->
  <path d="M 90 175 L 360 175" fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round" opacity="0.46" />
  <path d="M 360 175 L 90 175" fill="none" stroke="#ea580c" stroke-width="12" stroke-linecap="round" opacity="0.46" />

  <!-- Direction arrows are slightly separated so both directions remain legible. -->
  <path d="M 150 151 L 300 151" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)" />
  <path d="M 300 199 L 150 199" fill="none" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow-orange)" />
  <text x="225" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#1d4ed8">subpath 1: A → B</text>
  <text x="225" y="224" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#c2410c">subpath 2: B → A</text>

  <!-- The graph stores one geometric edge in a canonical direction. -->
  <path d="M 540 175 L 810 175" fill="none" stroke="#334155" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-graph)" />
  <circle cx="540" cy="175" r="9" fill="#fff" stroke="#dc2626" stroke-width="3" />
  <circle cx="810" cy="175" r="9" fill="#fff" stroke="#dc2626" stroke-width="3" />
  <text x="540" y="205" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#991b1b">v0</text>
  <text x="810" y="205" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#991b1b">v1</text>

  <rect x="638" y="112" width="74" height="38" rx="7" fill="#fff" stroke="#94a3b8" />
  <text x="675" y="137" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" font-weight="600" fill="#0f172a">1 / 1</text>
  <text x="675" y="239" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#475569">forward / reverse multiplicity</text>

  <text x="450" y="318" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">Two directed occurrences consolidate into one geometric edge.</text>
</svg>
