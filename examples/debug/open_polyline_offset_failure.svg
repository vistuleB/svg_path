<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <defs>
    <marker id="arrow-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16803c"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c02626"/>
    </marker>
    <style>
      .grid { stroke: #e5e7eb; stroke-width: 0.03; }
      .axis { stroke: #cbd5e1; stroke-width: 0.05; }
      .source { fill: none; stroke: #111; stroke-width: 0.16; marker-end: url(#arrow-black); }
      .expected { fill: none; stroke: #16803c; stroke-width: 0.14; marker-end: url(#arrow-green); }
      .current { fill: none; stroke: #c02626; stroke-width: 0.09; marker-end: url(#arrow-red); }
      .extra { fill: none; stroke: #f97316; stroke-width: 0.20; stroke-linecap: round; }
      .node { fill: white; stroke-width: 0.06; }
      .label { font: 15px ui-sans-serif, system-ui, sans-serif; fill: #111827; }
      .small { font: 12px ui-sans-serif, system-ui, sans-serif; fill: #374151; }
    </style>
  </defs>

  <rect width="900" height="520" fill="white"/>
  <text x="36" y="42" class="label">open polyline offset failure</text>
  <text x="36" y="68" class="small">black: source; green: expected trimmed offset; red: current trimmed offset; orange: extra connector walk currently retained</text>

  <g transform="translate(230 300) scale(20 -20)">
    <g>
      <line x1="-2" y1="-12" x2="14" y2="-12" class="grid"/>
      <line x1="-2" y1="-10" x2="14" y2="-10" class="grid"/>
      <line x1="-2" y1="-8" x2="14" y2="-8" class="grid"/>
      <line x1="-2" y1="-6" x2="14" y2="-6" class="grid"/>
      <line x1="-2" y1="-4" x2="14" y2="-4" class="grid"/>
      <line x1="-2" y1="-2" x2="14" y2="-2" class="grid"/>
      <line x1="-2" y1="0" x2="14" y2="0" class="axis"/>
      <line x1="-2" y1="2" x2="14" y2="2" class="grid"/>
      <line x1="-2" y1="-13" x2="-2" y2="2" class="grid"/>
      <line x1="0" y1="-13" x2="0" y2="2" class="axis"/>
      <line x1="2" y1="-13" x2="2" y2="2" class="grid"/>
      <line x1="4" y1="-13" x2="4" y2="2" class="grid"/>
      <line x1="6" y1="-13" x2="6" y2="2" class="grid"/>
      <line x1="8" y1="-13" x2="8" y2="2" class="grid"/>
      <line x1="10" y1="-13" x2="10" y2="2" class="grid"/>
      <line x1="12" y1="-13" x2="12" y2="2" class="grid"/>
      <line x1="14" y1="-13" x2="14" y2="2" class="grid"/>
    </g>

    <!-- source: M 0 0 H 10 V -10 -->
    <path d="M 0 0 H 10 V -10" class="source"/>

    <!-- expected: M 0 -2 H 8 V -10 -->
    <path d="M 0 -2 H 8 V -10" class="expected"/>

    <!-- current: M 0 -2 H 8 H 10 L 8 0 V -2 V -10 -->
    <path d="M 0 -2 H 8 H 10 L 8 0 V -2 V -10" class="current"/>

    <!-- retained extra connector run: H 10 L 8 0 V -2 -->
    <path d="M 8 -2 H 10 L 8 0 V -2" class="extra"/>

    <circle cx="0" cy="0" r="0.14" class="node" stroke="#111"/>
    <circle cx="10" cy="0" r="0.14" class="node" stroke="#111"/>
    <circle cx="10" cy="-10" r="0.14" class="node" stroke="#111"/>
    <circle cx="8" cy="-2" r="0.12" class="node" stroke="#f97316"/>
    <circle cx="10" cy="-2" r="0.12" class="node" stroke="#f97316"/>
    <circle cx="8" cy="0" r="0.12" class="node" stroke="#f97316"/>
  </g>

  <text x="110" y="468" class="small">The orange triangular connector walk is retained by contiguous source-order grouping. The expected output cuts directly from (8,-2) to (8,-10).</text>
</svg>
