<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720">
  <rect x="0" y="0" width="1500" height="720" fill="white"/>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #172554; }
    .title { font-size: 24px; font-weight: 600; }
    .label { font-size: 18px; }
    .note { font-size: 16px; fill: #475569; }
  </style>

  <text class="title" x="45" y="42">level-4 offset, distance 0.4 — first ambiguous cyclic-order group</text>

  <rect x="40" y="70" width="680" height="580" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="label" x="65" y="105">source and untrimmed offset (true relative scale)</text>

  <!-- Relevant generation-0 E source segments. -->
  <path d="M 95 500 L 325 500" fill="none" stroke="#16a34a" stroke-width="7" stroke-linecap="round"/>
  <path d="M 325 500 L 670 500" fill="none" stroke="#65a30d" stroke-width="7" stroke-linecap="round"/>
  <circle cx="95" cy="500" r="6" fill="#111827"/>
  <circle cx="325" cy="500" r="6" fill="#111827"/>
  <circle cx="670" cy="500" r="6" fill="#111827"/>
  <text class="label" x="150" y="535">E6.0g0</text>
  <text class="label" x="445" y="535">E0.0g0</text>

  <!-- Their distance-0.4 offsets and closing join. -->
  <path d="M 95 205 L 325.012 205" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
  <path d="M 325 205 L 670 205" fill="none" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round"/>
  <path d="M 325.012 205 L 325 205" fill="none" stroke="#dc2626" stroke-width="10" stroke-linecap="round"/>
  <circle cx="325" cy="205" r="7" fill="#111827"/>
  <text class="label" x="135" y="180">U12: offset of E6.0g0</text>
  <text class="label" x="410" y="180">U0: offset of E0.0g0</text>
  <text class="label" x="338" y="235" fill="#dc2626">U13: closing join</text>

  <path d="M 325 205 L 325 500" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8"/>
  <text class="note" x="340" y="365">offset distance 0.4</text>

  <rect x="760" y="70" width="700" height="580" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="label" x="785" y="105">closing micro-geometry (vertical displacement exaggerated)</text>

  <!-- x maps the 4.192274915e-5 closure width; y displacement is exaggerated. -->
  <line x1="820" y1="350" x2="1400" y2="350" stroke="#e2e8f0" stroke-width="2"/>
  <path d="M 795 310 L 1110 350" fill="none" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/>
  <path d="M 1110 350 L 1405 350" fill="none" stroke="#0ea5e9" stroke-width="7" stroke-linecap="round"/>
  <path d="M 1405 430 L 1110 350 L 815 350" fill="none" stroke="#dc2626" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 795 310 L 1110 350" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="10 7"/>

  <circle cx="815" cy="350" r="8" fill="#111827"/>
  <circle cx="1110" cy="350" r="10" fill="#111827"/>
  <circle cx="1405" cy="430" r="8" fill="#111827"/>
  <text class="label" x="1060" y="335">v116</text>
  <text class="label" x="800" y="390">U0.start</text>
  <text class="label" x="1310" y="465">U12.end</text>

  <text class="label" x="825" y="285" fill="#7c3aed">A143: U12 remainder</text>
  <text class="label" x="1160" y="330" fill="#0ea5e9">A138: U0 remainder</text>
  <text class="label" x="835" y="425" fill="#dc2626">A118: U13 and U0 coincide</text>
  <text class="label" x="1140" y="405" fill="#dc2626">A144: U13</text>

  <text class="note" x="790" y="535">U12.end − U0.start: Δx = 4.192274915e−5, Δy = 2.196896e−9</text>
  <text class="note" x="790" y="568">ambiguous outward group at v116: [A118 reversed, A143 reversed]</text>
  <text class="note" x="790" y="601">sample separation: 1.285097237e−9; angular separation: 0.006004989°</text>
</svg>
