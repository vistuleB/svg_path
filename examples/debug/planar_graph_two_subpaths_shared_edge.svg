<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500">
  <defs>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#2563eb" />
    </marker>
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#ea580c" />
    </marker>
    <marker id="graph-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#334155" />
    </marker>
  </defs>

  <rect width="920" height="500" fill="#f8fafc" />
  <line x1="460" y1="30" x2="460" y2="450" stroke="#cbd5e1" />
  <text x="230" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#0f172a">Two input subpaths</text>
  <text x="690" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#0f172a">Resulting graph</text>

  <!-- Blue closed subpath: left triangle. -->
  <g fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" opacity="0.62" marker-end="url(#blue-arrow)">
    <path d="M80 230 L230 90" />
    <path d="M230 90 L230 370" />
    <path d="M230 370 L80 230" />
  </g>

  <!-- Orange closed subpath: right triangle, traversing the shared edge oppositely. -->
  <g fill="none" stroke="#ea580c" stroke-width="7" stroke-linecap="round" opacity="0.62" marker-end="url(#orange-arrow)">
    <path d="M230 90 L380 230" />
    <path d="M380 230 L230 370" />
    <path d="M230 370 L230 90" />
  </g>

  <g font-family="system-ui, sans-serif" font-size="14">
    <circle cx="115" cy="420" r="7" fill="#2563eb" opacity="0.7" />
    <text x="130" y="425" fill="#1d4ed8">subpath 1</text>
    <circle cx="270" cy="420" r="7" fill="#ea580c" opacity="0.7" />
    <text x="285" y="425" fill="#c2410c">subpath 2</text>
  </g>

  <!-- Five geometric graph edges. -->
  <g fill="none" stroke="#334155" stroke-width="5" stroke-linecap="round" marker-end="url(#graph-arrow)">
    <path d="M540 230 L690 90" />
    <path d="M690 90 L690 370" />
    <path d="M690 370 L540 230" />
    <path d="M690 90 L840 230" />
    <path d="M840 230 L690 370" />
  </g>

  <g fill="#fff" stroke="#dc2626" stroke-width="3">
    <circle cx="540" cy="230" r="9" />
    <circle cx="690" cy="90" r="9" />
    <circle cx="690" cy="370" r="9" />
    <circle cx="840" cy="230" r="9" />
  </g>
  <g fill="#991b1b" font-family="ui-monospace, monospace" font-size="14">
    <text x="505" y="225">v0</text>
    <text x="670" y="70">v1</text>
    <text x="670" y="400">v2</text>
    <text x="852" y="225">v3</text>
  </g>

  <!-- Exterior multiplicities, centered over their graph edges. -->
  <g font-family="ui-monospace, monospace" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">
    <g>
      <rect x="588" y="144" width="54" height="31" rx="6" fill="#fff" stroke="#94a3b8" />
      <text x="615" y="165">1/0</text>
    </g>
    <g>
      <rect x="588" y="284" width="54" height="31" rx="6" fill="#fff" stroke="#94a3b8" />
      <text x="615" y="305">1/0</text>
    </g>
    <g>
      <rect x="738" y="144" width="54" height="31" rx="6" fill="#fff" stroke="#94a3b8" />
      <text x="765" y="165">1/0</text>
    </g>
    <g>
      <rect x="738" y="284" width="54" height="31" rx="6" fill="#fff" stroke="#94a3b8" />
      <text x="765" y="305">1/0</text>
    </g>
  </g>

  <!-- The shared geometric edge has one occurrence in each direction. -->
  <rect x="663" y="214.5" width="54" height="31" rx="6" fill="#fff" stroke="#94a3b8" />
  <text x="690" y="235.5" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#0f172a">1/1</text>

  <text x="460" y="478" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">One color per subpath; arrowheads mark segment directions.</text>
</svg>
