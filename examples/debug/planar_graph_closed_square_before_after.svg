<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480">
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#2563eb" />
    </marker>
    <marker id="a-graph" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#334155" />
    </marker>
  </defs>

  <rect width="900" height="480" fill="#f8fafc" />
  <line x1="450" y1="30" x2="450" y2="430" stroke="#cbd5e1" />
  <text x="225" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#0f172a">Input subpath</text>
  <text x="675" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#0f172a">Resulting graph</text>

  <!-- Input: one blue closed subpath, with an arrow on each segment. -->
  <path d="M105 100 L345 100" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" opacity="0.65" marker-end="url(#a-blue)" />
  <path d="M345 100 L345 340" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" opacity="0.65" marker-end="url(#a-blue)" />
  <path d="M345 340 L105 340" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" opacity="0.65" marker-end="url(#a-blue)" />
  <path d="M105 340 L105 100" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" opacity="0.65" marker-end="url(#a-blue)" />

  <!-- Graph: one vertex per corner and one stored edge per input segment. -->
  <path d="M555 100 L795 100" fill="none" stroke="#334155" stroke-width="5" marker-end="url(#a-graph)" />
  <path d="M795 100 L795 340" fill="none" stroke="#334155" stroke-width="5" marker-end="url(#a-graph)" />
  <path d="M795 340 L555 340" fill="none" stroke="#334155" stroke-width="5" marker-end="url(#a-graph)" />
  <path d="M555 340 L555 100" fill="none" stroke="#334155" stroke-width="5" marker-end="url(#a-graph)" />

  <g fill="#fff" stroke="#dc2626" stroke-width="3">
    <circle cx="555" cy="100" r="9" />
    <circle cx="795" cy="100" r="9" />
    <circle cx="795" cy="340" r="9" />
    <circle cx="555" cy="340" r="9" />
  </g>
  <g fill="#991b1b" font-family="ui-monospace, monospace" font-size="14">
    <text x="535" y="82">v0</text>
    <text x="806" y="82">v1</text>
    <text x="806" y="365">v2</text>
    <text x="525" y="365">v3</text>
  </g>

  <g font-family="ui-monospace, monospace" font-size="15" font-weight="600" fill="#0f172a">
    <g><rect x="653" y="65" width="44" height="25" rx="5" fill="#fff" stroke="#94a3b8" /><text x="675" y="83" text-anchor="middle">1/0</text></g>
    <g><rect x="807" y="207" width="44" height="25" rx="5" fill="#fff" stroke="#94a3b8" /><text x="829" y="225" text-anchor="middle">1/0</text></g>
    <g><rect x="653" y="350" width="44" height="25" rx="5" fill="#fff" stroke="#94a3b8" /><text x="675" y="368" text-anchor="middle">1/0</text></g>
    <g><rect x="499" y="207" width="44" height="25" rx="5" fill="#fff" stroke="#94a3b8" /><text x="521" y="225" text-anchor="middle">1/0</text></g>
  </g>

  <text x="675" y="414" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#475569">Every vertex has weighted degree 2.</text>
  <text x="450" y="458" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">Closed-square graph construction test</text>
</svg>
