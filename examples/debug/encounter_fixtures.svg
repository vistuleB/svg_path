<svg xmlns="http://www.w3.org/2000/svg" width="900" height="680" viewBox="0 0 900 680" role="img" aria-labelledby="title desc">
  <title id="title">Five encounter fixtures</title>
  <desc id="desc">Five rows classify points inside overlaps, boundary points, adjacent segment aliases, separate isolated intersections, and a self-crossing cubic with full overlap.</desc>
  <style>
    .row-bg { fill: #f7f7fa; }
    .base { fill: none; stroke: #7a7d8c; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; opacity: .55; }
    .left-path { fill: none; stroke: #3068d6; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .right-path { fill: none; stroke: #d37a22; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .overlap { fill: none; stroke: #23a47b; stroke-width: 10; stroke-linecap: round; opacity: .68; }
    .point { fill: #d33f49; stroke: #fff; stroke-width: 3; }
    .boundary-point { fill: #fff; stroke: #d33f49; stroke-width: 4; }
    .guide { stroke: #7a7d8c; stroke-width: 1.5; stroke-dasharray: 5 5; opacity: .65; }
    .number { fill: #20222b; font: 500 18px system-ui, sans-serif; }
    .title { fill: #20222b; font: 500 15px system-ui, sans-serif; }
    .note { fill: #656977; font: 12px system-ui, sans-serif; }
    .param { fill: #20222b; font: 12px ui-monospace, SFMono-Regular, monospace; }
    .legend-line { stroke-width: 5; stroke-linecap: round; }
  </style>

  <rect width="900" height="680" fill="#fff"/>
  <g transform="translate(500 22)">
    <line class="legend-line left-path" x1="0" x2="25" y1="0" y2="0"/><text class="note" x="33" y="4">left traversal</text>
    <line class="legend-line right-path" x1="128" x2="153" y1="0" y2="0"/><text class="note" x="161" y="4">right traversal</text>
    <line class="legend-line overlap" x1="278" x2="303" y1="0" y2="0"/><text class="note" x="315" y="4">overlap</text>
  </g>

  <g transform="translate(0 42)">
    <rect class="row-bg" width="900" height="116" rx="10"/>
    <text class="number" x="20" y="31">1</text>
    <text class="title" x="55" y="29">Point strictly inside an overlap</text>
    <text class="note" x="55" y="50">Both parameter addresses fall in the interior.</text>
    <line class="base" x1="315" y1="77" x2="785" y2="77"/>
    <line class="left-path" x1="315" y1="73" x2="785" y2="73"/>
    <line class="right-path" x1="315" y1="81" x2="785" y2="81"/>
    <line class="overlap" x1="409" y1="77" x2="691" y2="77"/>
    <circle class="point" cx="550" cy="77" r="7"/>
    <text class="param" x="390" y="105">t=.2</text><text class="param" x="680" y="105">t=.8</text><text class="param" x="531" y="105">t=.5</text>
  </g>

  <g transform="translate(0 168)">
    <rect class="row-bg" width="900" height="116" rx="10"/>
    <text class="number" x="20" y="31">2</text>
    <text class="title" x="55" y="29">Point at overlap boundary</text>
    <text class="note" x="55" y="50">The point and overlap endpoint use the same address.</text>
    <line class="base" x1="315" y1="77" x2="785" y2="77"/>
    <line class="left-path" x1="315" y1="73" x2="785" y2="73"/>
    <line class="right-path" x1="315" y1="81" x2="785" y2="81"/>
    <line class="overlap" x1="409" y1="77" x2="691" y2="77"/>
    <circle class="boundary-point" cx="409" cy="77" r="7"/>
    <text class="param" x="385" y="105">t=.2</text><text class="param" x="680" y="105">t=.8</text>
  </g>

  <g transform="translate(0 294)">
    <rect class="row-bg" width="900" height="116" rx="10"/>
    <text class="number" x="20" y="31">3</text>
    <text class="title" x="55" y="29">Boundary through an adjacent-segment alias</text>
    <text class="note" x="55" y="50">Right segment 0 ends where right segment 1 begins.</text>
    <path class="left-path" d="M315 88 L735 88 L735 57"/>
    <path class="right-path" d="M315 96 L525 96 L525 57"/>
    <line class="overlap" x1="315" y1="92" x2="525" y2="92"/>
    <circle class="boundary-point" cx="525" cy="92" r="7"/>
    <text class="param" x="548" y="80">right: seg 0, t=1</text>
    <text class="param" x="548" y="99">alias: seg 1, t=0</text>
  </g>

  <g transform="translate(0 420)">
    <rect class="row-bg" width="900" height="116" rx="10"/>
    <text class="number" x="20" y="31">4</text>
    <text class="title" x="55" y="29">Boundary point plus an isolated intersection</text>
    <text class="note" x="55" y="50">Only the point at x=5 is represented by the overlap.</text>
    <path class="left-path" d="M315 96 L735 96 L735 52"/>
    <path class="right-path" d="M315 104 L525 104 L805 48"/>
    <line class="overlap" x1="315" y1="100" x2="525" y2="100"/>
    <circle class="boundary-point" cx="525" cy="100" r="7"/>
    <circle class="point" cx="735" cy="62" r="7"/>
    <text class="note" x="498" y="78">boundary</text>
    <text class="note" x="748" y="62">isolated</text>
  </g>

  <g transform="translate(0 546)">
    <rect class="row-bg" width="900" height="126" rx="10"/>
    <text class="number" x="20" y="31">5</text>
    <text class="title" x="55" y="29">Full cubic overlap plus a distinct-parameter crossing</text>
    <text class="note" x="55" y="50">Overlap pairs t↔t; the crossing pairs .25↔.75.</text>
    <g transform="translate(635 67) scale(520 -190)">
      <path class="base" vector-effect="non-scaling-stroke" d="M0 0 C-.270833 -.333333 -.541667 -.333333 .1875 0"/>
      <path class="overlap" vector-effect="non-scaling-stroke" d="M0 0 C-.270833 -.333333 -.541667 -.333333 .1875 0"/>
    </g>
    <circle class="point" cx="537.5" cy="102.625" r="7"/>
    <line class="guide" x1="538" y1="103" x2="445" y2="103"/>
    <text class="param" x="300" y="99">crossing: (.25, .75)</text>
    <text class="param" x="300" y="117">overlap: (t, t)</text>
  </g>
</svg>
